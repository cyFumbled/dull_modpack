## Toggle if you can only enter rooms when the ship isn't landed. You will be teleported out when the ship fully lands.
# Setting type: Boolean
# Default value: false
No Room Access When Landed = false

## Toggle walk-in teleports when not in build mode.
# Setting type: Boolean
# Default value: true
Walk-In Teleport = true

## Prevent most listed enemies from using doors to pocket rooms.
