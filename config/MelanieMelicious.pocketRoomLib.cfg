## Enemies considered large-sized for enter and exit times.
# Setting type: String
# Default value: MouthDog,Peace Keeper,Monarch
Large-Size Enemy List = MouthDog,Peace Keeper,Monarch

## How long small enemies need to stand by entrances to teleport.
# Setting type: Int32
# Default value: 2
Small Enemy Entrance Teleport Time = 2

## How long small enemies need to stand by exits to teleport.
# Setting type: Int32
# Default value: 2
