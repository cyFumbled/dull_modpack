## Settings file was created by plugin WalkieSpamExplode v1.0.5
## Plugin GUID: ZetaArcade.WalkieSpamExplode

[Anger]

## The maximum amount of anger that is stored. Anger is added everytime they press the use key on the walkie, or toggle the lights with the Remote. When this value is reached, the player spamming the item will be punished.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 1 to 1000
Max Anger = 100

## How much anger is added to the 'anger meter' everytime they turn a Walkie on.
# Setting type: Int32
# Default value: 25
Walkie Anger Increase Amount = 25

## How much anger is added to the 'anger meter' everytime they toggle the ship lights with the Remote.
# Setting type: Int32
# Default value: 20
Remote Anger Increase Amount = 20

## How often the anger meter decreases by the anger decrease rate, in seconds.
# Setting type: Single
# Default value: 1
Anger Decrease Interval = 1

## How much anger is decreased every anger decrease interval, stopping at 0. Recommended to be above 0, or else Anger effectively never decreases.
# Setting type: Single
# Default value: 5
Anger Decrease Amount = 5

## When the anger reaches this amount, the player will be given a warning message in the HUD. Set to 0 or above the Max Anger to disable.
# Setting type: Int32
# Default value: 70
Anger Warning Threshold = 70

[Debugging]

## If true, prints debug info into the log.
# Setting type: Boolean
# Default value: false
Print Debug Info = false

[Explosion]

## The chance that the walkie will explode when max anger is reached, where 100 = 100%. If it fails, the battery will instead just be drained to 0. Set to 0 to disable explosions.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Walkie Explosion Chance = 100

## The chance that the remote will explode when max anger is reached, where 100 = 100%. If it fails, item will just be destroyed without the explosion. Set to 0 to disable explosions.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 100
Remote Explosion Chance = 100

## If true, explosions can occur when in orbit, when the ship is still landing etc.
# Setting type: Boolean
# Default value: false
Explosion in Orbit = false

## The radius of the explosion (instakill) 
# Setting type: Single
# Default value: 6.5
Explosion Radius = 6.5

## The outer radius of the explosion, where it damages the player but doesn't kill them
# Setting type: Single
# Default value: 7.5
Damage Radius = 7.5

## The amount of non-lethal damage caused by the outer radius of the explosion
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 1 to 100
Non-Lethal Damage = 50

[General]

## If true, the player will be punished for spamming the Walkie.
# Setting type: Boolean
# Default value: true
Punish Walkie Spam = true

## If true, the player will be punished for spamming the Remote.
# Setting type: Boolean
# Default value: true
Punish Remote Spam = true

## If true, when the max anger is reached and the player is punished, the item (Walkie/Remote) should also be destroyed. Disable if you don't want the item destroyed. Note that since the Remote doesn't have a battery, if the explosion fails it will always be destroyed, regardless of this config.
# Setting type: Boolean
# Default value: true
Destroy Item = true

